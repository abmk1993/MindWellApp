
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MindWell — Voice Coach</title>
<style>
  :root{
    --bg:#140f1f;
    --bg-soft:#1c1530;
    --surface:#261c40;
    --surface-2:#31244f;
    --ink:#f4eefc;
    --ink-dim:#b3a2ce;
    --sage:#4fd9c4;
    --sage-deep:#22a68f;
    --sand:#ff9f6b;
    --danger:#ff6b81;
    --on-accent:#1a1030;
    --radius:18px;
    --font-display:'Georgia','Times New Roman',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--font-body);background:var(--bg);color:var(--ink);
    display:flex;flex-direction:column;max-width:520px;margin:0 auto;
    height:100dvh;overflow:hidden;
  }

  header{
    padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid rgba(79,217,196,.12);
    background:linear-gradient(180deg,var(--bg-soft),var(--bg));flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .brand>div{min-width:0}
  .avatar{
    width:40px;height:40px;border-radius:50%;
    background:radial-gradient(circle at 32% 30%,var(--sage),var(--sage-deep));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:19px;color:var(--on-accent);position:relative;
  }
  .avatar.speaking{animation:breathe 1.4s ease-in-out infinite}
  @keyframes breathe{
    0%,100%{box-shadow:0 0 0 0 rgba(79,217,196,.45)}
    50%{box-shadow:0 0 0 12px rgba(79,217,196,0)}
  }
  .brand h1{font-family:var(--font-display);font-size:19px;font-weight:400;letter-spacing:.3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:block;font-size:11px;color:var(--ink-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .header-btns{display:flex;gap:8px}
  .icon-btn{
    width:38px;height:38px;border-radius:12px;border:1px solid rgba(79,217,196,.2);
    background:transparent;color:var(--sage);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .2s;
  }
  .icon-btn:active{background:var(--surface)}
  .icon-btn.on{background:var(--sage);color:var(--on-accent);border-color:var(--sage)}

  .approaches{display:flex;gap:8px;overflow-x:auto;padding:10px 18px;scrollbar-width:none;flex-shrink:0}
  .approaches::-webkit-scrollbar{display:none}
  .chip{
    flex-shrink:0;padding:7px 14px;border-radius:999px;font-size:13px;
    border:1px solid rgba(79,217,196,.25);background:transparent;color:var(--ink-dim);
    cursor:pointer;transition:all .2s;white-space:nowrap;
  }
  .chip.active{background:var(--sage);color:var(--on-accent);border-color:var(--sage);font-weight:600}

  #chat{flex:1;overflow-y:auto;padding:16px 18px 8px;display:flex;flex-direction:column;gap:12px;
    overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(79,217,196,.35) transparent}
  #chat::-webkit-scrollbar{width:5px}
  #chat::-webkit-scrollbar-track{background:transparent}
  #chat::-webkit-scrollbar-thumb{background:rgba(79,217,196,.3);border-radius:3px}
  #chat::-webkit-scrollbar-thumb:hover{background:rgba(79,217,196,.55)}
  .sheet{scrollbar-width:thin;scrollbar-color:rgba(79,217,196,.35) transparent}
  .sheet::-webkit-scrollbar{width:5px}
  .sheet::-webkit-scrollbar-thumb{background:rgba(79,217,196,.3);border-radius:3px}

  .scroll-down{
    position:absolute;right:16px;bottom:96px;z-index:6;
    width:40px;height:40px;border-radius:50%;border:1px solid rgba(79,217,196,.35);
    background:var(--surface-2);color:var(--sage);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    opacity:0;pointer-events:none;transform:translateY(8px);
    transition:opacity .2s, transform .2s;
  }
  .scroll-down.show{opacity:1;pointer-events:auto;transform:none}
  .chat-wrap{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
  .msg{max-width:86%;padding:12px 15px;border-radius:var(--radius);font-size:15px;line-height:1.55;
    animation:pop .25s ease;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;background:var(--sage-deep);color:var(--on-accent);border-bottom-right-radius:6px}
  .msg.ai{align-self:flex-start;background:var(--surface);border-bottom-left-radius:6px}
  .typing{align-self:flex-start;background:var(--surface);border-radius:var(--radius);padding:14px 18px;display:flex;gap:5px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--sage);opacity:.4;animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

  .mood-card{background:var(--surface);border-radius:var(--radius);padding:16px;text-align:center}
  .mood-card p{font-size:14px;color:var(--ink-dim);margin-bottom:12px}
  .moods{display:flex;justify-content:center;gap:10px}
  .moods button{font-size:26px;background:none;border:none;cursor:pointer;padding:6px;border-radius:12px;transition:transform .15s}
  .moods button:active{transform:scale(1.25)}

  .quick{display:flex;gap:8px;flex-wrap:wrap;padding:0 2px}
  .quick button{font-size:12.5px;padding:8px 12px;border-radius:999px;cursor:pointer;
    background:transparent;border:1px dashed rgba(255,159,107,.4);color:var(--sand);text-align:left}

  /* crisis support card */
  .crisis-card{
    background:linear-gradient(135deg,#3d1f38,#2a1730);
    border:1px solid rgba(255,107,129,.45);
    border-radius:var(--radius);padding:16px;align-self:stretch;
  }
  .crisis-card h3{font-size:15px;color:var(--danger);margin-bottom:6px}
  .crisis-card p{font-size:13.5px;line-height:1.55;color:var(--ink)}

  .composer{
    flex-shrink:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    background:var(--bg-soft);border-top:1px solid rgba(79,217,196,.12);
    display:flex;gap:8px;align-items:flex-end;position:relative;
  }
  #input{
    flex:1;background:var(--surface);border:1px solid rgba(79,217,196,.18);
    border-radius:22px;padding:12px 16px;color:var(--ink);font-size:15px;
    resize:none;max-height:110px;outline:none;font-family:var(--font-body);
  }
  #input:focus{border-color:var(--sage)}
  .round-btn{
    width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;font-size:19px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:transform .15s,background .2s;
  }
  .round-btn:active{transform:scale(.92)}
  #sendBtn{background:var(--sage);color:var(--on-accent)}
  #sendBtn:disabled{opacity:.35}

  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
  .sheet-backdrop.open{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:50%;transform:translate(-50%,105%);bottom:0;width:100%;max-width:520px;
    max-height:80dvh;overflow-y:auto;background:var(--bg-soft);border-radius:22px 22px 0 0;z-index:21;
    padding:20px 20px 34px;transition:transform .3s ease;
  }
  .sheet.open{transform:translate(-50%,0)}
  .sheet h2{font-family:var(--font-display);font-weight:400;font-size:20px;margin-bottom:4px}
  .sheet .sub{font-size:13px;color:var(--ink-dim);margin-bottom:16px}
  .grabber{width:42px;height:4px;border-radius:2px;background:rgba(79,217,196,.3);margin:0 auto 14px}
  .lib-item{background:var(--surface);border-radius:14px;padding:13px 15px;margin-bottom:10px;cursor:pointer}
  .lib-item h3{font-size:14.5px;color:var(--sand);font-weight:600;margin-bottom:3px}
  .lib-item p{font-size:13px;color:var(--ink-dim);line-height:1.45}

  /* settings */
  .set-group{margin-bottom:20px}
  .set-group label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);margin-bottom:8px}
  select{
    width:100%;background:var(--surface);color:var(--ink);border:1px solid rgba(79,217,196,.25);
    border-radius:12px;padding:12px 36px 12px 14px;font-size:15px;outline:none;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none' stroke='%23b3a2ce' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='5 8 10 13 15 8'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;background-size:16px;
  }
  .seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:4px}
  .seg button{
    flex:1;padding:10px 4px;border:none;border-radius:9px;background:transparent;color:var(--ink-dim);
    font-size:14px;cursor:pointer;transition:all .2s;
  }
  .seg button.active{background:var(--sage);color:var(--on-accent);font-weight:600}
  .voice-note{font-size:12px;color:var(--ink-dim);margin-top:8px;line-height:1.5}
  .test-voice{
    margin-top:10px;width:100%;padding:12px;border-radius:12px;border:1px dashed rgba(79,217,196,.35);
    background:transparent;color:var(--sage);font-size:14px;cursor:pointer;
  }

  .disclaimer{font-size:11px;color:var(--ink-dim);text-align:center;padding:2px 24px 6px;flex-shrink:0}

  /* ---------- ChatGPT-style voice mode ---------- */
  .voice-overlay{
    position:fixed;inset:0;z-index:40;
    background:radial-gradient(120% 100% at 50% 0%, #241a3f 0%, #0f0a1c 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:60px 24px calc(40px + env(safe-area-inset-bottom));
    opacity:0;pointer-events:none;transition:opacity .3s;
    max-width:520px;margin:0 auto;left:50%;transform:translateX(-50%);width:100%;
  }
  .voice-overlay.open{opacity:1;pointer-events:auto}

  .vm-status{font-size:15px;color:var(--ink-dim);letter-spacing:.04em;min-height:22px;text-align:center}

  .orb-zone{display:flex;flex-direction:column;align-items:center;gap:28px;flex:1;justify-content:center}
  .orb{
    width:170px;height:170px;border-radius:50%;position:relative;cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #c3fbef, var(--sage) 45%, var(--sage-deep) 100%);
    box-shadow:0 0 60px rgba(79,217,196,.25);
    transition:transform .3s;
  }
  .orb::before,.orb::after{
    content:'';position:absolute;inset:-14px;border-radius:50%;
    border:2px solid rgba(79,217,196,.28);opacity:0;
  }
  .orb::after{inset:-30px;border-color:rgba(79,217,196,.15)}

  /* listening: expanding rings */
  .voice-overlay.listening .orb::before{animation:ring 1.8s ease-out infinite}
  .voice-overlay.listening .orb::after{animation:ring 1.8s .5s ease-out infinite}
  @keyframes ring{
    0%{transform:scale(.85);opacity:.9}
    100%{transform:scale(1.25);opacity:0}
  }
  /* thinking: gentle slow pulse, dimmed */
  .voice-overlay.thinking .orb{
    animation:thinkPulse 1.6s ease-in-out infinite;
    filter:saturate(.55) brightness(.85);
  }
  @keyframes thinkPulse{0%,100%{transform:scale(.96)}50%{transform:scale(1.02)}}
  /* speaking: lively bounce */
  .voice-overlay.speaking .orb{animation:talkBounce .55s ease-in-out infinite}
  @keyframes talkBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  /* muted */
  .voice-overlay.muted .orb{filter:grayscale(.8) brightness(.6)}

  .vm-caption{
    min-height:48px;max-width:88%;text-align:center;
    font-size:16px;line-height:1.5;color:var(--ink);
  }
  .vm-caption.dim{color:var(--ink-dim);font-size:14px}

  .vm-controls{display:flex;gap:22px;align-items:center}
  .vm-btn{
    width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;font-size:22px;
    display:flex;align-items:center;justify-content:center;transition:transform .15s, background .2s;
  }
  .vm-btn:active{transform:scale(.92)}
  .vm-mute{background:var(--surface-2);color:var(--ink)}
  .vm-mute.on{background:var(--danger);color:var(--on-accent)}
  .vm-close{background:#3a1f2c;color:#ffb4c4}

  /* waveform icon in composer */
  #voiceModeBtn{background:var(--sand);color:var(--on-accent)}
  #voiceModeBtn svg{width:22px;height:22px}
  @media (prefers-reduced-motion: reduce){
    .orb,.orb::before,.orb::after{animation:none !important}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="avatar" id="avatar">M</div>
    <div>
      <h1>MindWell</h1>
      <small id="statusLine"></small>
    </div>
  </div>
  <div class="header-btns">
    <button class="icon-btn" id="libBtn" title="Library">📚</button>
    <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
    <button class="icon-btn on" id="voiceToggle" title="Voice replies">🔊</button>
  </div>
</header>

<div class="approaches" id="approachBar">
  <button class="chip active" data-approach="auto">✨ <span data-i="adaptive">Adaptive</span></button>
  <button class="chip" data-approach="cbt">CBT</button>
  <button class="chip" data-approach="dbt">DBT</button>
  <button class="chip" data-approach="act">ACT</button>
  <button class="chip" data-approach="mindfulness">Mindfulness</button>
  <button class="chip" data-approach="compassion">Self-Compassion</button>
  <button class="chip" data-approach="coaching">Coaching</button>
</div>

<div class="chat-wrap">
  <div id="chat"></div>
  <button class="scroll-down" id="scrollDown" title="Scroll to latest">↓</button>
</div>

<div class="composer">
  <textarea id="input" rows="1"></textarea>
  <button class="round-btn" id="sendBtn">➤</button>
  <button class="round-btn" id="voiceModeBtn" title="Voice conversation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <line x1="4"  y1="9"  x2="4"  y2="15"/>
      <line x1="9"  y1="5"  x2="9"  y2="19"/>
      <line x1="14" y1="8"  x2="14" y2="16"/>
      <line x1="19" y1="11" x2="19" y2="13"/>
    </svg>
  </button>
</div>

<!-- ChatGPT-style voice conversation overlay -->
<div class="voice-overlay" id="voiceOverlay">
  <div class="vm-status" id="vmStatus"></div>
  <div class="orb-zone">
    <div class="orb" id="orb"></div>
    <div class="vm-caption dim" id="vmCaption"></div>
  </div>
  <div class="vm-controls">
    <button class="vm-btn vm-mute" id="vmMuteBtn" title="Mute">🎙</button>
    <button class="vm-btn vm-close" id="vmCloseBtn" title="End voice chat">✕</button>
  </div>
</div>
<div class="disclaimer" id="disclaimer"></div>

<div class="sheet-backdrop" id="backdrop"></div>

<!-- Library sheet -->
<div class="sheet" id="libSheet">
  <div class="grabber"></div>
  <h2 id="libTitle"></h2>
  <p class="sub" id="libSub"></p>
  <div id="libList"></div>
</div>

<!-- Settings sheet -->
<div class="sheet" id="setSheet">
  <div class="grabber"></div>
  <h2 id="setTitle"></h2>
  <p class="sub" id="setSub"></p>

  <div class="set-group">
    <label id="langLabel"></label>
    <select id="langSelect">
      <option value="en">English</option>
      <option value="hy">Հայերեն (Armenian)</option>
      <option value="ru">Русский (Russian)</option>
      <option value="es">Español (Spanish)</option>
      <option value="fr">Français (French)</option>
      <option value="de">Deutsch (German)</option>
    </select>
  </div>

  <div class="set-group">
    <label id="genderLabel"></label>
    <div class="seg" id="genderSeg">
      <button data-g="auto" class="active">Auto</button>
      <button data-g="female" id="gFemale"></button>
      <button data-g="male" id="gMale"></button>
    </div>
  </div>

  <div class="set-group">
    <label id="voiceLabel"></label>
    <select id="voiceSelect"></select>
    <button class="test-voice" id="testVoice"></button>
    <p class="voice-note" id="voiceNote"></p>
  </div>
</div>

<script>
/* =========================================================
   I18N — UI strings per language
   ========================================================= */
const I18N = {
  en:{
    name:'English', srLang:'en-US', tagline:'Evidence-based support',
    placeholder:"What's on your mind?", listening:'🎙 Listening… speak now',
    disclaimer:'MindWell is a supportive companion, not a replacement for licensed care. In crisis, contact local emergency services.',
    welcome:"Hi, I'm MindWell. I draw on the most effective modern approaches — CBT, DBT, ACT, mindfulness and more — and we can talk by voice: tap the mic to speak, and I'll answer out loud.\n\nBefore we start, how are you feeling right now?",
    moodPrompt:'Tap the emoji closest to your mood',
    moodLabels:['really struggling','low','neutral','pretty good','great'],
    moodMsg:'Mood check-in',
    pickPrompt:'Pick one of these, type, or just tap the mic and talk to me.',
    quick:['I feel anxious and my thoughts are racing','Help me stop overthinking','I keep procrastinating on something important','I had a conflict with someone close to me','I want to build better habits','Guide me through a 2-minute breathing exercise'],
    approachSwitch:n=>`Okay — I'll work with you through a ${n} lens now. What would you like to focus on?`,
    teach:n=>`Teach me the essentials of ${n} and how I can apply it to my life this week.`,
    error:'I had trouble connecting just now. Take a breath — and try sending that again in a moment.',
    libTitle:'Knowledge foundations', libSub:'The approaches and landmark books MindWell draws on. Tap any item to explore it.',
    setTitle:'Voice & language', setSub:'Choose your language and the voice you want to hear.',
    langLabel:'Language', genderLabel:'Voice', voiceLabel:'Specific voice', female:'Female', male:'Male',
    testVoice:'▶ Test this voice', testPhrase:'Hello, I am MindWell. I am here with you.',
    voiceNote:'Available voices depend on your device and browser. On iPhone/Android you can install more voices in system settings. If your language has no voice installed, replies will show as text.',
    crisisTitle:'You matter — please reach out',
    crisisBody:'What you just shared sounds really heavy, and I want you to be safe. If you are thinking about hurting yourself, please contact your local emergency number (112 / 911) or a crisis hotline right now, or reach out to someone you trust. I will stay here with you too.',
    vmListening:'Listening…', vmThinking:'Thinking…', vmSpeaking:'Speaking… tap the orb to interrupt', vmMuted:'Microphone muted', vmHint:'Just start talking — I\'ll answer out loud', vmUnsupported:'Voice input isn\'t supported in this browser. Try Chrome or Safari.',
    session:'session'
  },
  hy:{
    name:'Հայերեն', srLang:'hy-AM', tagline:'Գիտականորեն հիմնավորված աջակցություն',
    placeholder:'Ի՞նչ կա մտքիդ', listening:'🎙 Լսում եմ… խոսիր',
    disclaimer:'MindWell-ը աջակցող ուղեկից է, ոչ թե լիցենզավորված բուժման փոխարինող։ Ճգնաժամի դեպքում դիմեք շտապ օգնություն (112)։',
    welcome:'Բարև, ես MindWell-ն եմ։ Ես հիմնվում եմ ամենաարդյունավետ ժամանակակից մոտեցումների վրա՝ CBT, DBT, ACT, մայնդֆուլնես և այլն, և կարող ենք խոսել ձայնով՝ սեղմիր խոսափողը, և ես կպատասխանեմ ձայնով։\n\nՆախքան սկսելը՝ ինչպե՞ս ես քեզ զգում հիմա։',
    moodPrompt:'Ընտրիր տրամադրությանդ ամենամոտ էմոջին',
    moodLabels:['շատ վատ','վատ','չեզոք','լավ','հիանալի'],

/* =========================================================
   CRISIS DETECTION — client-side, multi-language
   ========================================================= */
const CRISIS_PATTERNS = [
  /suicid|kill myself|end my life|end it all|self[- ]?harm|hurt myself|don'?t want to live|want to die|no reason to live/i,
  /покончить с собой|убить себя|не хочу жить|хочу умереть|самоповрежд|порезать себя|свести счеты/i,
  /ինքնասպան|չեմ ուզում ապրել|ուզում եմ մեռնել|վնասել ինքս ինձ/i,
  /suicid|matarme|quitarme la vida|no quiero vivir|hacerme daño|quiero morir/i,
  /me tuer|mettre fin à mes jours|ne veux plus vivre|me faire du mal|envie de mourir/i,
  /selbstmord|suizid|mich umbringen|nicht mehr leben|mir wehtun|sterben will/i
];
let crisisShown = false;
function checkCrisis(text){
  if(crisisShown) return;
  if(CRISIS_PATTERNS.some(rx=>rx.test(text))){
    crisisShown = true;
    const card = document.createElement('div');
    card.className = 'crisis-card';
    card.innerHTML = `<h3>♥ ${T().crisisTitle}</h3><p>${T().crisisBody}</p>`;
    chat.appendChild(card);
    scrollBottom(true);
  }
}

let allVoices = [];
function loadVoices(){
  allVoices = speechSynthesis.getVoices();
  populateVoiceSelect();
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;

function voicesForLang(){
  return allVoices.filter(v => v.lang.toLowerCase().startsWith(lang));
}
function guessGender(v){
  const n = v.name;
  if(FEMALE_NAMES.test(n)) return 'female';
  if(MALE_NAMES.test(n)) return 'male';
  return 'unknown';
}
function currentVoice(){
  const pool = voicesForLang();
  if(!pool.length) return null;
  // explicit selection wins if still valid for this language
  if(chosenVoiceURI){
    const v = pool.find(v=>v.voiceURI===chosenVoiceURI);
    if(v) return v;
  }
  if(genderPref !== 'auto'){
    const g = pool.find(v=>guessGender(v)===genderPref);
    if(g) return g;
  }
  // prefer higher-quality / default voices
  return pool.find(v=>/natural|premium|enhanced|google/i.test(v.name)) || pool.find(v=>v.default) || pool[0];
}
function populateVoiceSelect(){
  const pool = voicesForLang();
  voiceSelect.innerHTML = '';
  if(!pool.length){
    const o = document.createElement('option');
    o.textContent = '— no voices for this language on this device —';
    o.value = '';
    voiceSelect.appendChild(o);
    return;
  }
  const autoOpt = document.createElement('option');
  autoOpt.value=''; autoOpt.textContent='Auto (best match)';
  voiceSelect.appendChild(autoOpt);
  pool.forEach(v=>{
    const o = document.createElement('option');
    const g = guessGender(v);
    o.value = v.voiceURI;
    o.textContent = `${v.name} ${g==='female'?'♀':g==='male'?'♂':''} (${v.lang})`;
    voiceSelect.appendChild(o);
  });
  voiceSelect.value = (chosenVoiceURI && pool.some(v=>v.voiceURI===chosenVoiceURI)) ? chosenVoiceURI : '';
}
voiceSelect.addEventListener('change', ()=>{
  chosenVoiceURI = voiceSelect.value || null;
  store('mw_voice', chosenVoiceURI || '');
});

document.getElementById('genderSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#genderSeg button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  genderPref = b.dataset.g;
  chosenVoiceURI = null; voiceSelect.value='';
  store('mw_gender', genderPref); store('mw_voice','');
});

document.getElementById('testVoice').addEventListener('click', ()=> speak(T().testPhrase, true));

/* =========================================================
   TTS
   ========================================================= */
/* iOS/Chrome block speech that isn't triggered by a user tap.
   Trick: on the FIRST user gesture, speak a silent utterance to "unlock"
   the synthesizer — after that, async replies can speak freely. */
let ttsUnlocked = false;
let silentAudio = null;
function unlockTTS(){
  if(ttsUnlocked) return;
  try{
    if('speechSynthesis' in window){
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      speechSynthesis.speak(u);
    }
    // also prime an <audio> element so ElevenLabs playback isn't blocked
    // by mobile autoplay policy when a reply arrives asynchronously later
    silentAudio = new Audio();
    silentAudio.play().catch(()=>{});
    ttsUnlocked = true;
  }catch(e){}
}
document.addEventListener('pointerdown', unlockTTS, {once:false});
document.addEventListener('keydown', unlockTTS, {once:false});

let currentAudio = null;
function stopSpeaking(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(currentAudio){ try{ currentAudio.pause(); }catch(e){} currentAudio = null; }
  avatar.classList.remove('speaking');
}

/* Realistic voice via ElevenLabs (server relay at /api/tts).
   Once the server reports the feature isn't configured, stop asking. */
let elevenUnavailable = false;
async function fetchElevenAudioURL(text){
  if(elevenUnavailable) return null;
  try{
    const res = await fetch('/api/tts', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ text, gender: genderPref })
    });
    if(!res.ok){
      if(res.status === 501) elevenUnavailable = true;
      return null;
    }
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  }catch(e){ return null; }
}

let currentUtterance = null; // Safari can silently GC an utterance mid-speech if nothing keeps it alive
function speakNative(clean, finish){
  if(!('speechSynthesis' in window)){ finish(); return; }
  if(!allVoices.length) allVoices = speechSynthesis.getVoices();
  const u = new SpeechSynthesisUtterance(clean);
  currentUtterance = u;
  const v = currentVoice();
  if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = T().srLang; }
  u.rate = 0.97; u.pitch = 1.0;
  u.onstart = ()=> avatar.classList.add('speaking');
  u.onend = ()=>{ if(currentUtterance===u) currentUtterance=null; finish(); };
  u.onerror = ()=>{ if(currentUtterance===u) currentUtterance=null; finish(); };
  setTimeout(()=> speechSynthesis.speak(u), 60);
}

async function speak(text, force, onDone){
  if(!voiceReplies && !force){ if(onDone) onDone(); return; }
  stopSpeaking();
  const clean = text.replace(/[*_#`>~]/g,'').replace(/\s+/g,' ').trim();
  if(!clean){ if(onDone) onDone(); return; }
  let done = false;
  const finish = ()=>{ avatar.classList.remove('speaking'); if(!done){ done = true; if(onDone) onDone(); } };

  const url = await fetchElevenAudioURL(clean);
  if(url){
    // Reuse the SAME <audio> element unlocked in unlockTTS() during the user's
    // tap. iOS Safari grants autoplay permission per-element, not per-page —
    // a brand-new Audio(url) created here (after the async fetch above) would
    // never have been touched by a user gesture and iOS silently blocks it.
    const audioEl = silentAudio || new Audio();
    audioEl.src = url;
    currentAudio = audioEl;
    const cleanup = ()=>{ URL.revokeObjectURL(url); if(currentAudio===audioEl) currentAudio=null; finish(); };
    audioEl.onplay = ()=> avatar.classList.add('speaking');
    audioEl.onended = cleanup;
    audioEl.onerror = cleanup;
    audioEl.play().catch(()=>{ URL.revokeObjectURL(url); currentAudio=null; speakNative(clean, finish); });
    return;
  }
  speakNative(clean, finish);
}
voiceToggle.addEventListener('click', ()=>{
  unlockTTS();
  voiceReplies = !voiceReplies;
  voiceToggle.classList.toggle('on', voiceReplies);
  voiceToggle.textContent = voiceReplies ? '🔊' : '🔇';
  if(!voiceReplies){
    stopSpeaking();
  }else{
    // audible confirmation so the user knows the toggle works
    speak(T().testPhrase, true);
  }
});
if(!('speechSynthesis' in window)){
  voiceToggle.style.opacity = .35;
  voiceToggle.title = 'Speech not supported in this browser';
}

/* =========================================================
   STT — recognition language follows app language.
   A brand-new SpeechRecognition instance is created for every
   listening turn instead of reusing one shared object: with a
   single shared instance, a late onresult/onend event from a
   turn that hadn't fully torn down could overwrite the next
   turn's transcript and get resent — the "answers my previous
   question again" bug. recSeq guards against exactly that: any
   event from an instance that's been superseded is ignored.
   ========================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let recSeq = 0;
let vmListening = false;

function normalizeForEcho(s){
  return s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim();
}
/* Fraction of `heardWords` that also appear in `speakingWords`. Word-overlap
   rather than a substring/exact match, because speech recognition of the
   AI's own synthesized voice bouncing off a speaker is rarely word-perfect —
   one misheard word would break a strict substring check and make real echo
   look like a genuine interruption. */
function echoOverlapRatio(heardWords, speakingWords){
  if(!heardWords.length || !speakingWords.size) return 0;
  let matches = 0;
  for(const w of heardWords){ if(speakingWords.has(w)) matches++; }
  return matches / heardWords.length;
}
function createRecognition(){
  const rec = new SR();
  rec.interimResults = true;
  rec.continuous = false;
  const mySeq = ++recSeq;
  let text = '';
  let bargedIn = false; // true once real (non-echo) speech has promoted us out of 'speaking'
  rec.onresult = (e)=>{
    if(mySeq !== recSeq || !voiceMode) return;
    let final='', interim='';
    for(const r of e.results){ (r.isFinal ? final += r[0].transcript : interim += r[0].transcript); }
    const heard = (final || interim).trim();
    if(vmState === 'speaking' && !bargedIn){
      // Without headphones the mic often picks up the AI's own voice from the
      // speaker. If most of what we "heard" also appears in the reply that's
      // currently playing, treat it as echo, not a real interruption.
      const words = normalizeForEcho(heard).split(' ').filter(Boolean);
      const overlap = echoOverlapRatio(words, vmSpeakingWords);
      const isEcho = words.join('').length < 3 || overlap >= 0.5;
      if(isEcho) return;
      // Real barge-in: the user started talking over the AI — stop it
      // immediately instead of waiting for playback to finish.
      bargedIn = true;
      stopSpeaking();
      setVM('listening');
    }
    if(vmState !== 'listening') return; // still speaking (echo) — don't record it as the answer
    text = heard;
    vmText = text;
    vmCaption.classList.remove('dim');
    vmCaption.textContent = text;
  };
  rec.onend = ()=>{
    vmListening = false;
    if(mySeq !== recSeq || !voiceMode || vmMuted) return;
    if(text.trim()){
      vmSend(text);
    }else if(vmState === 'listening' || vmState === 'speaking'){
      const wasSpeaking = vmState === 'speaking';
      // restart quickly while still speaking so background barge-in
      // listening stays live for the whole reply, longer pause during
      // genuine silence-retry so we don't hammer the recognizer
      setTimeout(()=>{ if(voiceMode && !vmMuted && mySeq===recSeq && (vmState==='listening' || vmState==='speaking')) vmStartRec(vmState==='speaking'); }, wasSpeaking ? 50 : 350);
    }
  };
  rec.onerror = (e)=>{
    vmListening = false;
    if(mySeq !== recSeq) return;
    if(voiceMode && (e.error === 'not-allowed' || e.error === 'service-not-allowed')){
      vmStatus.textContent = T().vmUnsupported;
    }
  };
  return rec;
}
/* =========================================================
   VOICE MODE — ChatGPT-style hands-free conversation
   States: listening → thinking → speaking → listening …
   ========================================================= */
let voiceMode = false;
let vmState = 'idle';      // listening | thinking | speaking | muted
let vmText = '';
let vmMuted = false;
let vmSpeakingText = '';   // normalized text of the reply currently playing, for echo filtering
let vmSpeakingWords = new Set();

const voiceOverlay = document.getElementById('voiceOverlay');
const vmStatus = document.getElementById('vmStatus');
const vmCaption = document.getElementById('vmCaption');
const vmMuteBtn = document.getElementById('vmMuteBtn');
const vmCloseBtn = document.getElementById('vmCloseBtn');
const orb = document.getElementById('orb');

function setVM(state){
  vmState = state;
  voiceOverlay.classList.remove('listening','thinking','speaking','muted');
  if(state !== 'idle') voiceOverlay.classList.add(state);
  const labels = {listening:T().vmListening, thinking:T().vmThinking, speaking:T().vmSpeaking, muted:T().vmMuted};
  vmStatus.textContent = labels[state] || '';
}
/* background=true keeps the current visual/logical state (used to listen
   for barge-in while the AI is still talking) instead of switching to
   'listening' outright. */
function vmStartRec(background){
  if(!SR || !voiceMode || vmMuted) return;
  vmText = '';
  if(recognition){
    recognition.onresult = null; recognition.onend = null; recognition.onerror = null;
    try{ recognition.abort(); }catch(e){}
  }
  recognition = createRecognition();
  recognition.lang = T().srLang;
  try{ recognition.start(); vmListening = true; }catch(e){ vmListening = false; }
  if(!background) setVM('listening');
}
/* called when TTS playback finishes on its own (no barge-in) */
function afterSpeak(){
  vmSpeakingText = '';
  vmSpeakingWords = new Set();
  if(!voiceMode) return;
  if(vmState !== 'listening') setVM('listening');
  if(!vmListening) vmStartRec();
}
function enterVoiceMode(){
  if(!SR){
    // diagnose WHY, so the user knows what to do
    let reason;
    if(window.self !== window.top){
      reason = '⚠️ Voice is blocked because the app is running inside an embedded preview. Download this file and open it directly in Chrome or Safari — voice will work there.';
    }else if(typeof InstallTrigger !== 'undefined' || /firefox/i.test(navigator.userAgent)){
      reason = '⚠️ Firefox does not support voice input yet. Please open this file in Chrome, Edge, or Safari.';
    }else{
      reason = T().vmUnsupported;
    }
    addMsg('ai', reason);
    return;
  }
  unlockTTS();
  voiceMode = true;
  vmMuted = false;
  vmMuteBtn.classList.remove('on');
  vmCaption.classList.add('dim');
  vmCaption.textContent = T().vmHint;
  voiceOverlay.classList.add('open');
  stopSpeaking();
  vmStartRec();
}
function exitVoiceMode(){
  voiceMode = false;
  voiceOverlay.classList.remove('open');
  setVM('idle');
  vmCaption.textContent = '';
  stopSpeaking();
  recSeq++; // invalidate any in-flight recognition events
  if(recognition){ try{ recognition.abort ? recognition.abort() : recognition.stop(); }catch(e){} }
  vmListening = false;
}
async function vmSend(text){
  setVM('thinking');
  vmCaption.classList.remove('dim');
  vmCaption.textContent = text;
  addMsg('user', text);
  checkCrisis(text);
  history.push({role:'user', content:text});
  try{
    const reply = await askClaude();
    if(!voiceMode) return;              // user closed while waiting
    addMsg('ai', reply);
    history.push({role:'assistant', content:reply});
    setVM('speaking');
    vmCaption.classList.add('dim');
    vmCaption.textContent = reply.length > 220 ? reply.slice(0,220)+'…' : reply;
    vmSpeakingText = normalizeForEcho(reply);
    vmSpeakingWords = new Set(vmSpeakingText.split(' ').filter(Boolean));
    vmStartRec(true); // listen in the background so the user can interrupt
    speak(reply, true, afterSpeak);
  }catch(err){
    console.error(err);
    if(!voiceMode) return;
    addMsg('ai', T().error);
    setVM('speaking');
    vmSpeakingText = normalizeForEcho(T().error);
    vmSpeakingWords = new Set(vmSpeakingText.split(' ').filter(Boolean));
    vmStartRec(true);
    speak(T().error, true, afterSpeak);
  }
}
/* tap orb while it speaks = interrupt and talk */
orb.addEventListener('click', ()=>{
  if(!voiceMode) return;
  if(vmState === 'speaking'){
    stopSpeaking();
    vmStartRec();
  }else if(vmMuted){
    vmMuteBtn.click();
  }
});
vmMuteBtn.addEventListener('click', ()=>{
  vmMuted = !vmMuted;
  vmMuteBtn.classList.toggle('on', vmMuted);
  if(vmMuted){
    stopSpeaking();
    recSeq++;
    if(recognition){ try{ recognition.abort ? recognition.abort() : recognition.stop(); }catch(e){} }
    vmListening = false;
    setVM('muted');
  }else{
    vmStartRec();
  }
});
vmCloseBtn.addEventListener('click', exitVoiceMode);
document.getElementById('voiceModeBtn').addEventListener('click', enterVoiceMode);

/* =========================================================
   UI helpers
   ========================================================= */
/* ---- smart scrolling ---- */
const scrollDownBtn = document.getElementById('scrollDown');
function nearBottom(){ return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120; }
function scrollBottom(force){
  if(force || nearBottom()){
    requestAnimationFrame(()=> chat.scrollTo({top:chat.scrollHeight, behavior:'smooth'}));
  }
}
function updateScrollBtn(){ scrollDownBtn.classList.toggle('show', !nearBottom()); }
chat.addEventListener('scroll', updateScrollBtn, {passive:true});
scrollDownBtn.addEventListener('click', ()=> scrollBottom(true));

function addMsg(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + (role==='user'?'user':'ai');
  div.textContent = text;
  const stick = nearBottom() || role==='user';
  chat.appendChild(div);
  scrollBottom(stick);
  updateScrollBtn();
  return div;
}
function showTyping(){
  const t=document.createElement('div');
  t.className='typing'; t.id='typing';
  t.innerHTML='<span></span><span></span><span></span>';
  chat.appendChild(t); scrollBottom(true);
}
function hideTyping(){ document.getElementById('typing')?.remove(); }
function autoGrow(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,110)+'px'; }
input.addEventListener('input', autoGrow);

/* =========================================================
   CLAUDE API
   ========================================================= */
async function askClaude(){
  const resp = await fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      messages: history,
      approach,
      lang,
      mood,
      session: sessionNum
    })
  });
  const data = await resp.json();
  if(!resp.ok || data.error) throw new Error(data.message||data.error||'API error');
  return data.reply;
}
async function send(){
  const text = input.value.trim();
  if(!text) return;
  input.value=''; autoGrow();
  stopSpeaking();
  addMsg('user', text);
  checkCrisis(text);
  history.push({role:'user', content:text});
  showTyping(); sendBtn.disabled=true;
  try{
    const reply = await askClaude();
    hideTyping();
    addMsg('ai', reply);
    history.push({role:'assistant', content:reply});
    speak(reply);
  }catch(err){
    hideTyping();
    addMsg('ai', T().error);
    console.error(err);
  }finally{
    sendBtn.disabled=false;
  }
}
sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }});

/* =========================================================
   Approach chips
   ========================================================= */
document.getElementById('approachBar').addEventListener('click', e=>{
  const btn = e.target.closest('.chip'); if(!btn) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  approach = btn.dataset.approach;
  const names={auto:'Adaptive',cbt:'CBT',dbt:'DBT',act:'ACT',mindfulness:'Mindfulness',compassion:'Self-Compassion',coaching:'Coaching'};
  addMsg('ai', T().approachSwitch(names[approach]));
});

/* =========================================================
   Sheets (library + settings)
   ========================================================= */
const backdrop = document.getElementById('backdrop');
const libSheet = document.getElementById('libSheet');
const setSheet = document.getElementById('setSheet');
function openSheet(s){ s.classList.add('open'); backdrop.classList.add('open'); }
function closeSheets(){ [libSheet,setSheet].forEach(s=>s.classList.remove('open')); backdrop.classList.remove('open'); }
document.getElementById('libBtn').addEventListener('click', ()=>openSheet(libSheet));
document.getElementById('settingsBtn').addEventListener('click', ()=>{ populateVoiceSelect(); openSheet(setSheet); });
backdrop.addEventListener('click', closeSheets);

const libList = document.getElementById('libList');
KNOWLEDGE.frameworks.forEach(f=>{
  const d=document.createElement('div');
  d.className='lib-item';
  d.innerHTML=`<h3>${f.name}</h3><p>${f.gist}</p><p style="margin-top:5px;color:var(--sage);font-size:12px">📖 ${f.source}</p>`;
  d.addEventListener('click', ()=>{ closeSheets(); input.value = T().teach(f.name); send(); });
  libList.appendChild(d);
});

/* =========================================================
   Language switching
   ========================================================= */
function applyLanguageUI(){
  const t = T();
  document.documentElement.lang = lang;
  document.getElementById('statusLine').innerHTML = `${t.tagline} · ${t.session} ${sessionNum}`;
  input.placeholder = t.placeholder;
  document.getElementById('disclaimer').textContent = t.disclaimer;
  document.getElementById('libTitle').textContent = t.libTitle;
  document.getElementById('libSub').textContent = t.libSub;
  document.getElementById('setTitle').textContent = t.setTitle;
  document.getElementById('setSub').textContent = t.setSub;
  document.getElementById('langLabel').textContent = t.langLabel;
  document.getElementById('genderLabel').textContent = t.genderLabel;
  document.getElementById('voiceLabel').textContent = t.voiceLabel;
  document.getElementById('gFemale').textContent = '♀ ' + t.female;
  document.getElementById('gMale').textContent = '♂ ' + t.male;
  document.getElementById('testVoice').textContent = t.testVoice;
  document.getElementById('voiceNote').textContent = t.voiceNote;
  langSelect.value = lang;
  populateVoiceSelect();
}
langSelect.addEventListener('change', ()=>{
  lang = langSelect.value;
  store('mw_lang', lang);
  chosenVoiceURI = null; store('mw_voice','');
  applyLanguageUI();
  closeSheets();
  addMsg('ai', T().welcome.split('\n')[0]);  // greet briefly in new language
  speak(T().welcome.split('\n')[0]);
});
// restore gender segment state
document.querySelectorAll('#genderSeg button').forEach(b=>{
  b.classList.toggle('active', b.dataset.g === genderPref);
});

/* =========================================================
   Welcome flow
   ========================================================= */
function welcome(){
  applyLanguageUI();
  addMsg('ai', T().welcome);

  const card=document.createElement('div');
  card.className='mood-card';
  const emojis=['😞','😕','😐','🙂','😄'];
  card.innerHTML=`<p>${T().moodPrompt}</p><div class="moods">${
    emojis.map((e,i)=>`<button data-i="${i}">${e}</button>`).join('')
  }</div>`;
  chat.appendChild(card);

  card.querySelector('.moods').addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    const i=Number(b.dataset.i);
    mood = T().moodLabels[i];
    card.remove();
    addMsg('user', `${T().moodMsg}: ${emojis[i]} (${mood})`);
    history.push({role:'user', content:`(Mood check-in: ${mood})`});
    quickPrompts();
  });
}
function quickPrompts(){
  const wrap=document.createElement('div');
  wrap.className='quick';
  T().quick.forEach(p=>{
    const b=document.createElement('button');
    b.textContent=p;
    b.addEventListener('click', ()=>{ wrap.remove(); input.value=p; send(); });
    wrap.appendChild(b);
  });
  chat.appendChild(wrap);
  scrollBottom(true);
  addMsg('ai', T().pickPrompt);
}
welcome();
